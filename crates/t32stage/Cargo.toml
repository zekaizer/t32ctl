[package]
name = "t32stage"
description = "Staging over TRACE32 RCL: VM: transfer, self-extracting bundles, script runner, cleanup ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Script builders for scripted stage conversations. Enable from dev-dependencies only.
testkit = ["t32rcl/testkit"]

[dependencies]
t32rcl.workspace = true
flate2.workspace = true
sha2.workspace = true

[dev-dependencies]
t32rcl = { workspace = true, features = ["testkit"] }
# Oracle only: builds reference archives that the tar walker must read.
tar = "0.4"
